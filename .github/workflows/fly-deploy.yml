# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    # Read by no check and held by no image, so a push of these alone starts no runner.
    paths-ignore:
      - README.md
      - LICENSE
      - Makefile
      - .env.example
      - docs/**
  workflow_dispatch: # allow manual deploys from the Actions tab

# One run at a time, oldest first, so an older commit can never deploy over a
# newer one. A run in progress is never cancelled mid-deploy; of the runs
# waiting behind it, only the newest is kept.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# A job bills whole minutes, so a push starts as few as it can: one for the checks,
# and for a change to the image one that builds and deploys and one that names it.
jobs:
  # Holds no secret: its dependencies are hundreds of packages nobody here wrote.
  check:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the last green run is read from this workflow's own history
    outputs:
      image: ${{ steps.changed.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff below reaches back to the last commit that passed
      # Decided here, on the runner the checks use, so no job starts only to decide.
      - name: What does this push need?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/changed-since-green.sh
      # Only a plain "false" skips a step below, so a missing answer never skips a check.
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.checks != 'false'
        with:
          node-version: 22
      # The installed modules are kept whole, so only a lockfile change pays for an install.
      - uses: actions/cache@v6
        id: modules
        if: steps.changed.outputs.checks != 'false'
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.changed.outputs.checks != 'false' && steps.modules.outputs.cache-hit != 'true'
      # Prettier reads the workflows and the suite reads nearly every file, so both always run.
      - run: npm run format:check
        if: steps.changed.outputs.checks != 'false'
      # ESLint and the tests' typecheck read code, which .github holds none of.
      - run: npm run lint
        if: steps.changed.outputs.code != 'false'
      # The app's typecheck leaves the tests out, so a change to them alone skips it.
      - run: npm run typecheck
        if: steps.changed.outputs.app != 'false'
      - run: npm run typecheck:tests
        if: steps.changed.outputs.code != 'false'
      - run: npm run test
        if: steps.changed.outputs.checks != 'false'

  # Builds, backs up and releases on one runner, and only once the checks have passed.
  deploy:
    name: Build and deploy
    needs: check
    # Never starts when the image would match the live one, and the naming job then skips too.
    # Anything but a plain "false" releases, so a missing answer never leaves a change behind.
    if: needs.check.outputs.image != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff below reaches back to the commit that is live
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # fly.toml is gitignored (config lives in `fly secrets`); the committed
      # fly.toml.example carries the non-secret app config CI deploys with.
      - name: Build image
        run: flyctl deploy --build-only --push --remote-only --image-label "sha-${GITHUB_SHA}" --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A release may change the data one way, so one that can touch the volume is backed up first.
      - name: Can this release change what is on the volume?
        id: touches
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash .github/scripts/touches-volume.sh
      # Anything but a plain "false" takes it, so a missing answer never skips a restore point.
      - name: Back up the database
        if: steps.touches.outputs.needed != 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # The script stops the job on any failure, so nothing goes out without a copy that opens.
        run: bash .github/scripts/backup-db.sh "pre-release-${GITHUB_SHA::7}"
      - run: flyctl deploy --image "registry.fly.io/innospace-bookings:sha-${GITHUB_SHA}" --ha=false --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Runs only after a deploy that went out, so a tag always marks a build that reached production.
  # A job of its own: Copilot's package is fetched fresh, and this one holds no key to Fly or the backups.
  release:
    name: Name the release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the default token is read-only
      copilot-requests: write # Copilot words the description, billed to the owner's seat
    steps:
      # For the scripts below. No token is left in the folder: this job's can write to the repository.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # couch-gag gives the same episode for the same commit, so a re-run uses no new one.
      - name: Ask couch-gag for this release's episode
        id: episode
        env:
          COUCH_GAG_URL: ${{ vars.COUCH_GAG_URL }}
          COUCH_GAG_KEY: ${{ secrets.COUCH_GAG_KEY }}
        run: bash .github/scripts/release-name.sh

      # Copilot words the description from the commits since the last release, on the owner's seat.
      - name: Ask Copilot for the description
        # A release Copilot could not describe still gets GitHub's own list, so this step may fail.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          # Pinned because it runs with this job's token.
          COPILOT_CLI: "1.0.114"
          RULES: >-
            Write the description of a GitHub release from the commits and changed files below.
            Answer with GitHub Markdown only, with no preamble and no closing remark.
            Start with one or two plain sentences on what this release changes for the people who use the app.
            Then list the notable changes as short bullets under "### Changes",
            and only where there are any under "### Fixes" and "### Internal".
            Describe only what the commits and files show and never invent a change.
            Use plain hyphens, never an em dash or an en dash.
            Do not use tools: everything you need is below. Keep it under 200 words.
        run: bash .github/scripts/release-notes.sh

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          TITLE: ${{ steps.episode.outputs.title }}
        run: bash .github/scripts/release-create.sh
