# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual deploys from the Actions tab

# One run at a time, oldest first, so an older commit can never deploy over a
# newer one. A run in progress is never cancelled mid-deploy; of the runs
# waiting behind it, only the newest is kept.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run test

  # Runs beside the checks rather than after them, so gating the release on the
  # checks costs no time: the image is built and pushed, but not released.
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        # fly.toml is gitignored (config lives in `fly secrets`); the committed
        # fly.toml.example carries the non-secret app config CI deploys with.
      - run: flyctl deploy --build-only --push --remote-only --image-label "sha-${GITHUB_SHA}" --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Releases the image built above, and only once the checks have passed.
  deploy:
    name: Deploy app
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff below reaches back to the commit that is live
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # A release may change the data one way, so one that can touch the volume is backed up first.
      - name: Can this release change what is on the volume?
        id: touches
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: innospace-bookings
          # What opens or lays out the volume: the database modules, the image's boot and the mount.
          TOUCHES: src/lib/db.ts Dockerfile docker-entrypoint.sh fly.toml.example
        run: |
          set -euo pipefail
          # The live image's tag is its commit, with "sha-" stripped where the label carries it.
          live=$(flyctl image show -a "$APP" --json | jq -r '.[0].Tag // empty' | sed 's/^sha-//') || live=
          # From what is live, not the last push: a failed or superseded run hides no change.
          # shellcheck disable=SC2086
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$live" ] && git diff --quiet "$live" HEAD -- $TOUCHES; then
            echo "::notice::Nothing that touches the volume changed since $live, so no backup is taken."
            echo "No restore point for this release: nothing that touches the volume changed." >> "$GITHUB_STEP_SUMMARY"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            # A manual run, an image no commit names, or a diff git could not make: back up anyway.
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      # Anything but a plain "false" takes it, so a missing answer never skips a restore point.
      - name: Back up the database
        if: steps.touches.outputs.needed != 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BACKUP_TOKEN: ${{ secrets.R2_BACKUP_TOKEN }}
        # The script stops the job on any failure, so nothing goes out without a copy that opens.
        run: bash .github/scripts/backup-db.sh "pre-release-${GITHUB_SHA::7}"
      - run: flyctl deploy --image "registry.fly.io/innospace-bookings:sha-${GITHUB_SHA}" --ha=false --config fly.toml.example
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Runs only after a deploy that went out, so a tag always marks a build that reached production.
  release:
    name: Name the release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the default token is read-only
      copilot-requests: write # Copilot words the description, billed to the owner's seat
    steps:
      # couch-gag gives the same episode for the same commit, so a re-run uses no new one.
      - name: Ask couch-gag for this release's episode
        id: episode
        env:
          COUCH_GAG_URL: ${{ vars.COUCH_GAG_URL }}
          COUCH_GAG_KEY: ${{ secrets.COUCH_GAG_KEY }}
        run: |
          body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_SHA" '{repo: $repo, ref: $ref}')
          release=$(curl --fail-with-body -sS --retry 4 --retry-all-errors --max-time 20 \
            -H "Authorization: Bearer $COUCH_GAG_KEY" -H "Content-Type: application/json" \
            -d "$body" "$COUCH_GAG_URL/v1/releases")
          tag=$(jq -r '"r\(.sequence)-\(.slug)"' <<<"$release")
          if ! [[ "$tag" =~ ^r[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::couch-gag answered something that is not a release: $release"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.name' <<<"$release")" >> "$GITHUB_OUTPUT"

      # Copilot words the description from the commits since the last release, on the owner's seat.
      - name: Ask Copilot for the description
        # A release Copilot could not describe still gets GitHub's own list, so this step may fail.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          # Pinned because it runs with this job's token.
          COPILOT_CLI: "1.0.114"
          RULES: >-
            Write the description of a GitHub release from the commits and changed files below.
            Answer with GitHub Markdown only, with no preamble and no closing remark.
            Start with one or two plain sentences on what this release changes for the people who use the app.
            Then list the notable changes as short bullets under "### Changes",
            and only where there are any under "### Fixes" and "### Internal".
            Describe only what the commits and files show and never invent a change.
            Use plain hyphens, never an em dash or an en dash.
            Do not use tools: everything you need is below. Keep it under 200 words.
        run: |
          set -euo pipefail
          # Nothing to describe without a tag, and an existing release keeps the text it has.
          [ -n "$TAG" ] || exit 0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || previous=
          subjects='"- " + (.commit.message | split("\n") | map(select(length > 0)) | join("\n  "))'
          if [ -n "$previous" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq \
              "\"Commits:\n\" + ([.commits[] | $subjects] | join(\"\n\")) + \"\n\nFiles changed:\n\" + ([.files[] | \"\(.status) \(.filename) (+\(.additions) -\(.deletions))\"] | join(\"\n\"))" \
              > "$RUNNER_TEMP/changes.txt"
          else
            # A first release has nothing to compare with, so its last commits stand in.
            gh api "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&per_page=20" --jq \
              "\"Commits:\n\" + ([.[] | $subjects] | join(\"\n\"))" > "$RUNNER_TEMP/changes.txt"
          fi
          # A commit released twice has nothing new to describe, and Copilot would say so in the release.
          grep -q '^- ' "$RUNNER_TEMP/changes.txt" || exit 0
          npm install --global --silent --no-audit --no-fund "@github/copilot@$COPILOT_CLI"
          # No tools, so it can only word what it is handed; capped so a large release still fits one prompt.
          copilot -p "$RULES"$'\n\n'"$(head -c 20000 "$RUNNER_TEMP/changes.txt")" -s --available-tools= > "$RUNNER_TEMP/draft.md"
          [ -s "$RUNNER_TEMP/draft.md" ] || { echo "::warning::Copilot wrote nothing, so the release keeps GitHub's own notes."; exit 1; }
          mv "$RUNNER_TEMP/draft.md" "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          TITLE: ${{ steps.episode.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            # Copilot's words go above GitHub's own list; without them the list stands alone.
            notes=()
            if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes "$(cat "$RUNNER_TEMP/notes.md")"); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TITLE" --generate-notes "${notes[@]}"
          fi
